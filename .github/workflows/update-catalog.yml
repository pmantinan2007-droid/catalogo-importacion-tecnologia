name: Actualizar catálogo
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Importar catálogo real de los cuatro proveedores
        env:
          ARS_PER_USD: ${{ vars.ARS_PER_USD }}
          MARGIN_PERCENT: "40"
          MAX_PAGES_PER_PROVIDER: "12"
          REQUEST_DELAY_SECONDS: "0.8"
        run: python importer/import_catalog.py
      - name: Guardar catálogo e informe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/import_report.json
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Actualizar catálogo real de proveedores"
            git push
          fi
