name: Actualizar catálogo
on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *" # diario 10:17 UTC
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Importar catálogo
        env:
          ARS_PER_USD: ${{ vars.ARS_PER_USD }}
        run: python importer/import_catalog.py
      - name: Guardar cambios del catálogo
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add data/products.json
          git diff --cached --quiet || (git commit -m "Actualizar catálogo automáticamente" && git push)
